# The QNF Verso blueprint is a self-contained Lake package. It depends on the
# upstream QuadraticNumberFields project through Lake rather than assuming a
# particular local parent-directory layout.

name = "QNFBlueprint"
precompileModules = false
defaultTargets = ["QNFBlueprint"]

[leanOptions]
experimental.module = true
verso.blueprint.foldCodeBlocks = true

# Dependency resolution note: keep the upstream project after VersoBlueprint so
# the QuadraticNumberFields mathlib/repl pins win when Lake reconciles
# dependencies.

[[require]]
name = "VersoBlueprint"
git = "https://github.com/leanprover/verso-blueprint"
rev = "af54e3eedd11e4a7604544712e70d447b6dc55aa"

[[require]]
name = "QuadraticNumberFields"
git = "https://github.com/WangFrankie/QuadraticNumberFields"
rev = "main"

[[lean_lib]]
name = "QNFBlueprint"

[[lean_exe]]
name = "blueprint-gen"
root = "QNFBlueprintMain"
